name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cicd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - carify
          - funny-json
          - get-or-create
          - html
          - sql-storage
          - text-cleaner
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          working_directory: ${{ matrix.package }}
      - run: deno
        if: github.event_name != 'push'
        working-directory: ${{ matrix.package }}
      - run: deno test -A
        working-directory: ${{ matrix.package }}
      - run: bun test mod.test.ts
        if: matrix.package == 'sql-storage'
        working-directory: ${{ matrix.package }}
      - run: node --test mod.test.ts
        if: matrix.package == 'sql-storage'
        working-directory: ${{ matrix.package }}
      - run: deno publish --dry-run
        if: github.event_name != 'push'
        working-directory: ${{ matrix.package }}
      - run: deno publish
        if: github.event_name == 'push'
        working-directory: ${{ matrix.package }}

  coverage:
    needs: cicd
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: deno test -A --coverage=cov
      - run: deno coverage cov
      - uses: actions/upload-pages-artifact@v5
        with:
          path: cov/html
      - uses: actions/deploy-pages@v5
        id: deployment
